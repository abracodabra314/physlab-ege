# Сборка и тесты лаборатории на каждый пуш в рабочую ветку:
# Linux (ubuntu + EL8 для РЕД ОС), Windows (MSVC) и macOS (clang).
# Минуты macOS в приватном репозитории тарифицируются ×10 — осознанно.
name: build-and-test

on:
  push:
    # Рабочая ветка одна — собираем только её (и PR в неё).
    branches: [sketch-style]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Для Red OS — контейнер EL8 (РЕД ОС 7.3/8 ≈ RHEL 8, glibc 2.28),
    # чтобы бинарь запускался на РЕД ОС без правок.
    container: ${{ matrix.container || null }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (ubuntu)
            id: ubuntu
            os: ubuntu-latest
          - name: Red OS (EL8)
            id: redos
            os: ubuntu-latest
            container: rockylinux/rockylinux:8
          - name: Windows (msvc)
            id: windows
            os: windows-latest
          - name: macOS (clang)
            id: macos
            os: macos-14  # общий пул macos-latest сейчас стабильно снимается 15-минутным таймаутом очереди

    steps:
      - uses: actions/checkout@v4

      # build/ отслеживается в репозитории (macOS-кэш) — в CI собираем с нуля.
      - name: Очистка пришедшего build/
        shell: bash
        run: rm -rf build

      # EL8 (база РЕД ОС 7.3/8): свой Python и оффициальный Qt 6.7 — его
      # бинари собраны под glibc 2.28 и запускаются на РЕД ОС без правок.
      # install-qt-action в контейнере не годится: тянет CPython 3.15.
      - name: Пакеты и Qt в контейнере EL8 (для Red OS)
        if: matrix.container != ''
        run: |
          dnf -y install git cmake python3.11 python3.11-pip \
              mesa-libGL mesa-libGL-devel libxkbcommon libxkbcommon-x11 \
              freetype-devel fontconfig-devel which \
              gcc-toolset-13-gcc-c++ gcc-toolset-13-libstdc++-devel
          python3.11 -m pip install --quiet aqtinstall
          python3.11 -m aqt install-qt linux desktop 6.7.3 -O /opt/Qt
          echo "CMAKE_PREFIX_PATH=/opt/Qt/6.7.3/gcc_64" >> $GITHUB_ENV
          echo "PATH=/opt/Qt/6.7.3/gcc_64/bin:/opt/rh/gcc-toolset-13/root/usr/bin:$PATH" >> $GITHUB_ENV

      - name: Qt 6 из Homebrew (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> $GITHUB_ENV

      - name: Установить Qt 6 (для хостовых job'ов)
        if: runner.os != 'macOS' && matrix.container == ''
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'

      - name: Сборка (CMake + Qt)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLAB_BUILD_TESTS=ON
          cmake --build build --config Release -j 2

      - name: Модульные тесты
        run: ctest --test-dir build --output-on-failure

      - name: QA-рендер сцен (offscreen)
        if: runner.os == 'Linux'
        run: ./build/physlab --shots qa-shots
        env:
          QT_QPA_PLATFORM: offscreen

      - name: QA-рендер сцен (offscreen, Windows)
        if: runner.os == 'Windows'
        # GUI-подсистема (WIN32_EXECUTABLE): PowerShell не ждёт такие
        # процессы сам — ждём явно, иначе артефакт снимет половину кадров.
        run: Start-Process -FilePath .\build\Release\physlab.exe -ArgumentList '--shots','qa-shots' -Wait
        env:
          QT_QPA_PLATFORM: offscreen

      - name: QA-рендер сцен (offscreen, macOS)
        if: runner.os == 'macOS'
        run: ./build/physlab --shots qa-shots
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Windows — разложить Qt DLL рядом с exe
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "delims=" %%i in ('dir /b /s build\physlab.exe') do windeployqt "%%i" --release

      - name: Сохранить сборку
        uses: actions/upload-artifact@v4
        with:
          name: physlab-${{ matrix.id }}
          path: |
            build/physlab
            build/Release/**
            build/physlab.app/**
            build/bin/physlab*
          if-no-files-found: warn

      - name: Сохранить скриншоты сцен
        uses: actions/upload-artifact@v4
        with:
          name: qa-shots-${{ matrix.id }}
          path: qa-shots
          if-no-files-found: ignore
